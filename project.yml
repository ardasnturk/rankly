name: Rankly
options:
  bundleIdPrefix: com.ardasenturk
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    MACOSX_DEPLOYMENT_TARGET: "14.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.4"
targets:
  Rankly:
    type: application
    platform: macOS
    sources: [Rankly]
    dependencies:
      - package: Sparkle
    info:
      path: Rankly/Info.plist
      properties:
        CFBundleDisplayName: Rankly
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "© 2026 Arda Sentürk. MIT License."
        SUFeedURL: https://rankly.ardasnturk.com/appcast.xml
        SUPublicEDKey: "XPS+L43Wj6drxcPXknaOZ/tr7RDKFN8Iz86zwZa+AyY="
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUEnableInstallerLauncherService: true
    entitlements:
      path: Rankly/Rankly.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # Local integration API for Vitrin / MCP clients (bound to 127.0.0.1 only)
        com.apple.security.network.server: true
        # Sparkle's installer XPC services (sandboxed apps)
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ardasenturk.rankly
        PRODUCT_NAME: Rankly
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: 5JMD3VSD7N
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
